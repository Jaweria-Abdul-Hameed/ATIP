<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ATIP · Visual UI Reference</title><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#fafaf8;--surface:#fff;--text:#171717;--muted:#737373;--border:#e5e5e5;--soft:#f3f3f1}body.dark{--bg:#101010;--surface:#181818;--text:#f5f5f5;--muted:#a3a3a3;--border:#333;--soft:#242424}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Figtree,Arial,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}.shell{display:flex;min-height:100vh}.sidebar{width:244px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 12px}.brand{font-weight:700;letter-spacing:-.06em;font-size:27px;padding:4px 14px 26px}.brand small{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:500;margin-top:2px}.org{border:1px solid var(--border);padding:12px;border-radius:9px;margin:0 6px 22px;font-weight:600}.org span{float:right;color:var(--muted)}nav{display:grid;gap:3px}nav button{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:transparent;border:0;color:var(--muted);border-radius:8px;padding:11px 12px}nav button.active{background:var(--soft);color:var(--text);font-weight:600}nav button:hover{background:var(--soft);color:var(--text)}.glyph{font-size:17px;width:21px;text-align:center}.bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:14px}.main{min-width:0;flex:1}.top{height:72px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 36px}.crumb{color:var(--muted)}.crumb b{color:var(--text)}.user{display:flex;align-items:center;gap:15px;color:var(--muted)}.avatar{width:31px;height:31px;border-radius:50%;background:var(--text);color:var(--surface);display:grid;place-items:center;font-weight:600}.content{max-width:1380px;padding:46px 42px 80px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700}.heading{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:9px 0 32px}h1{font-family:'Source Serif 4',Georgia,serif;font-size:36px;font-weight:400;letter-spacing:-.035em;margin:0 0 6px}.sub{color:var(--muted);line-height:1.6}.primary{background:var(--text);color:var(--surface);border:1px solid var(--text);padding:11px 17px;border-radius:8px;font-weight:600}.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:10px 15px;border-radius:8px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{border:1px solid var(--border);border-radius:11px;background:var(--surface)}.card{padding:23px}.card .num{font-size:31px;font-weight:600;letter-spacing:-.05em;margin:14px 0 5px}.label{font-size:12px;color:var(--muted)}.section{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;margin-top:24px}.panel{overflow:hidden}.panelhead{padding:19px 21px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600}.panelbody{padding:20px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--soft)}td,th{padding:15px 18px;border-bottom:1px solid var(--border);white-space:nowrap}tr:last-child td{border-bottom:0}.tag{display:inline-block;border:1px solid var(--border);background:var(--soft);border-radius:5px;padding:4px 8px;font-size:11px;font-weight:600}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}input,select{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:11px 13px;border-radius:8px;min-width:150px}.tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow:auto}.tabs button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:13px 0;white-space:nowrap}.tabs button.active{border-color:var(--text);color:var(--text);font-weight:600}.empty{padding:58px 24px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:8px}.bars{height:165px;display:flex;align-items:flex-end;gap:13px;padding:20px 5px}.bars i{display:block;background:var(--text);opacity:.72;flex:1;border-radius:4px 4px 0 0}.flow{display:flex;gap:8px;align-items:center;justify-content:space-around;flex-wrap:wrap;padding:32px 8px}.node{border:1px solid var(--border);padding:16px;border-radius:9px;background:var(--soft);min-width:105px;text-align:center}.chat{display:grid;grid-template-columns:240px 1fr;min-height:430px}.chat aside{border-right:1px solid var(--border);padding:18px;background:var(--soft)}.bubble{padding:17px;border:1px solid var(--border);border-radius:10px;max-width:650px;line-height:1.7;margin:18px}.bubble.userbubble{margin-left:auto;background:var(--soft);max-width:450px}.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--soft);padding:18px;line-height:1.8;overflow:auto}.footerhint{font-size:11px;color:var(--muted);margin-top:30px}.mobilemenu{display:none}@media(max-width:950px){.sidebar{width:74px}.brand{font-size:17px;padding-left:8px}.brand small,.org,nav button .navlabel,.bottom .navlabel{display:none}.sidebar nav button{justify-content:center}.grid{grid-template-columns:repeat(2,1fr)}.section{grid-template-columns:1fr}.content{padding:28px 22px}.top{padding:0 22px}}@media(max-width:600px){.sidebar{width:55px;padding:15px 4px}.brand{font-size:14px}.top{height:58px}.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.card .num{font-size:22px}h1{font-size:28px}.heading{align-items:start}.chat{grid-template-columns:1fr}.chat aside{display:none}.content{padding:22px 14px}.top{padding:0 12px}}
.tag{font-size:10px;letter-spacing:.01em}.panel .code{border:1px solid var(--border);border-radius:8px}.panel h3{font-family:Figtree,Arial,sans-serif}.tag{color:var(--text)}@media(max-width:950px){.section{grid-template-columns:1fr}} </style></head><body><div class="shell"><aside class="sidebar"><div class="brand">ATIP<small>TESTING INTELLIGENCE</small></div><div class="org">◈ &nbsp; Acme Workspace <span>⌄</span></div><nav id="nav"></nav><div class="bottom"><nav><button data-page="Settings"><span class="glyph">⚙</span><span class="navlabel">Settings</span></button></nav><div class="label" style="padding:18px 12px">UI reference · demo only</div></div></aside><div class="main"><header class="top"><div class="crumb">Acme Workspace &nbsp; / &nbsp; <b id="crumb">Overview</b></div><div class="user"><button class="secondary" onclick="document.body.classList.toggle('dark')">◐ Theme</button><span>⌕</span><span class="avatar">A</span></div></header><main class="content"><div class="eyebrow">Autonomous Testing Intelligence Platform <span class="tag">DEMO DATA</span></div><div class="heading"><div><h1 id="title">Overview</h1><div class="sub" id="subtitle">Your software quality, at a glance.</div></div><div id="action"></div></div><div id="page"></div><div class="footerhint">ATIP design reference — visual layout and working demo navigation, not a connected backend.</div></main></div></div><script>
const names=['Overview','Repositories','Repository Workspace','Risk Intelligence','White-Box Coverage','Test Plans','Test Runs','Run Details','AI Analysis','Reports','Settings','Sign In'];const icons=['◫','▤','⌘','◇','◉','☷','▷','≡','✳','▥','⚙','⇥'];let current='Overview';const rows=(a)=>'<div class="panel tablewrap"><table><thead><tr>'+a[0].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+a.slice(1).map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';const tag=x=>'<span class="tag">'+x+'</span>';const demo='<span class="tag">Demo</span>';const repos=[['Repository','Branch','Last analysis','Risk','Status'],['◈ acme / frontend','main','2 hours ago','32 / 100',tag('Ready')],['◈ acme / backend','main','5 hours ago','68 / 100',tag('Review')],['◈ acme / api-gateway','develop','Yesterday','24 / 100',tag('Ready')]];const runs=[['Run','Repository','Tests','Duration','Status'],['#RUN-1042','acme / backend','128 passed · 3 failed','2m 18s',tag('Failed')],['#RUN-1041','acme / frontend','94 passed','1m 42s',tag('Passed')],['#RUN-1040','acme / api-gateway','52 passed','54s',tag('Passed')]];function panel(t,b){return '<div class="panel"><div class="panelhead">'+t+' <span class="label">View all ↗</span></div>'+b+'</div>'}function stats(a){return '<div class="grid">'+a.map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="num">'+x[1]+'</div><div class="label">'+x[2]+'</div></div>').join('')+'</div>'}function toolbar(){return '<div class="toolbar"><input id="filter" placeholder="⌕ Search…" oninput="filterTable(this.value)"><div class="row"><select><option>All repositories</option><option>acme / frontend</option><option>acme / backend</option></select><button class="secondary" onclick="alert(\'Demo filter. Backend integration comes later.\')">Filters</button></div></div>'}function filterTable(q){document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')};function tabs(arr){return '<div class="tabs">'+arr.map((x,i)=>'<button class="'+(!i?'active':'')+'" onclick="this.parentNode.querySelectorAll(\'button\').forEach(b=>b.classList.remove(\'active\'));this.classList.add(\'active\');document.getElementById(\'tabcontent\').innerHTML=\'<div class=empty><strong>\'+this.textContent+\'</strong>Reference tab interaction; real content implemented during build.</div>\'">'+x+'</button>').join('')+'</div><div id="tabcontent"></div>'}function view(n){current=n;try{history.replaceState(null,'','#'+encodeURIComponent(n))}catch(e){};document.querySelector('#crumb').textContent=n;document.querySelector('#title').textContent=n;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===n));let s='',action='',sub='';switch(n){case'Overview':sub='Your software quality, at a glance.';action='<button class="primary" onclick="view(\'Repositories\')">+ Connect repository</button>';s=stats([['Connected repositories','03','Across your organization'],['Analysis runs','128','Illustrative activity'],['High-risk findings','07','Need attention'],['Test pass rate','96.8%','Last 30 days']])+'<div class="section">'+panel('Recent test runs',rows(runs)) +panel('Quality trend','<div class="panelbody"><div class="bars">'+[34,50,39,65,52,79,62,91,76,88].map(h=>'<i style="height:'+h+'%"></i>').join('')+'</div><div class="label">Example trend · illustrative data</div></div>')+'</div>';break;case'Repositories':sub='Connect, synchronize, and explore your codebases.';action='<button class="primary" onclick="alert(\'GitHub App setup requires real credentials; not connected in this demo.\')">+ Connect GitHub</button>';s=toolbar()+rows(repos)+'<p class="footerhint"><button class="secondary" onclick="view(\'Repository Workspace\')">Open selected repository →</button></p>';break;case'Repository Workspace':sub='acme / backend · main · Last analysis 5 hours ago';action='<button class="primary" onclick="alert(\'Demo: analysis needs backend and GitHub integration.\')">▷ Analyze repository</button>';s=tabs(['Overview','Commits','Files','Dependencies','Coverage'])+'<div class="section">'+panel('Repository health',stats([['Risk score','68','Elevated'],['Files','218','Indexed'],['Tests','128','Discovered'],['Coverage','81%','Imported']]))+panel('Dependency map','<div class="flow"><div class="node">API</div>→<div class="node">Auth</div>→<div class="node">Database</div></div>')+'</div>';break;case'Risk Intelligence':sub='Understand which changes deserve attention first.';action='<button class="secondary">Export evidence</button>';s=toolbar()+stats([['Critical files','07','Example data'],['High risk','19','Example data'],['Coverage gaps','12','Example data'],['Changed modules','34','Example data']])+'<div style="height:22px"></div>'+rows([['File','Risk','Change frequency','Coverage','Reason'],['src/auth/session.py','91 / 100','High','42%',tag('High churn + low coverage')],['src/api/users.py','78 / 100','Medium','56%',tag('Recent defects')],['src/billing/invoice.py','64 / 100','High','72%',tag('Dependency impact')]]) ;break;case'White-Box Coverage':sub='Measured white-box objectives, evidence, and gaps across Python and JavaScript/TypeScript.';action='<button class="primary" onclick="alert(\'Demo: targeted test generation requires an analyzed commit and execution policy.\')">+ Generate gap tests</button>';s='<div class="toolbar"><div class="row"><select><option>acme / backend</option><option>acme / frontend</option></select><select><option>main · 8c3e91a</option><option>feature/payment</option></select><select><option>All techniques</option><option>MC/DC</option><option>Data flow</option></select></div><span class="tag">Example evidence · not executed</span></div>'+stats([['Statement coverage','81%','Example only'],['Decision / branch','74%','Example only'],['MC/DC','Unknown','Needs condition tracing'],['Mutation score','62%','Example only']])+'<div class="section">'+panel('White-box objective matrix',rows([['Technique','Objectives','Covered','Status'],['Statements','312','253',tag('Partial')],['Decision / branch','84','62',tag('Partial')],['Atomic conditions','56','—',tag('Unknown')],['MC/DC independence','28','—',tag('Unverified')],['Basis / selected paths','34','11',tag('Partial')],['Loop cases','19','9',tag('Partial')],['Definition-use pairs','63','—',tag('Unsupported')],['Exception paths','14','8',tag('Partial')],['Boundary values','22','13',tag('Partial')],['Mutation operators','80','50 killed',tag('Partial')],['Impacted regression','48','39 passed',tag('Partial')]]))+panel('Evidence and coverage gaps','<div class="panelbody"><div class="eyebrow">CONDITION INDEPENDENCE</div><h3 style="font-weight:600;margin:10px 0">MC/DC proof required</h3><p class="sub">For each atomic condition, compare two executed tests that differ in that condition and change the decision outcome. Branch coverage alone is insufficient.</p><div class="code">A &amp;&amp; B<br>T1: A=1, B=1 → 1<br>T2: A=0, B=1 → 0<br>T3: A=1, B=0 → 0</div><p class="sub">Illustration only · no executed proof attached</p><div class="row"><span class="tag">3 unknown</span><span class="tag">2 unsupported</span><span class="tag">11 uncovered</span></div><p style="margin-top:18px"><button class="secondary" onclick="alert(\'Demo only: evidence requires real instrumentation.\')">Inspect objective evidence ↗</button></p></div>')+'</div>'+panel('Gap-driven verification loop','<div class="flow"><div class="node">Discover objectives</div><div class="node">Generate candidates</div><div class="node">Sandbox execution</div><div class="node">Measure evidence</div><div class="node">Rerun gaps</div></div>');break;case'Test Plans':sub='Review evidence-backed test selection before execution.';action='<button class="primary" onclick="alert(\'Demo: no plan created.\')">+ New test plan</button>';s=toolbar()+rows([['Plan','Repository','Tests','Created','Approval'],['PLAN-208','acme / backend','24 selected · 3 proposed','Today',tag('Awaiting review')],['PLAN-207','acme / frontend','16 selected','Yesterday',tag('Approved')]])+'<div style="height:20px"></div>'+panel('Selected plan · PLAN-208','<div class="panelbody"><p>24 impacted regression tests, 3 proposed new tests, with evidence-linked rationale.</p><button class="primary" onclick="alert(\'Demo only. Approval must be server-enforced.\')">Review plan</button></div>');break;case'Test Runs':sub='Monitor execution, results, and isolated runner status.';action='<button class="primary" onclick="alert(\'Sandbox execution is not configured in this UI reference.\')">▷ New run</button>';s=toolbar()+rows(runs)+'<p><button class="secondary" onclick="view(\'Run Details\')">View run details →</button></p>';break;case'Run Details':sub='RUN-1042 · acme / backend · commit 8c3e91a';action='<button class="secondary" onclick="alert(\'Demo only.\')">Cancel run</button>';s=stats([['Status','Failed','Example only'],['Passed','128','Tests'],['Failed','03','Tests'],['Duration','2m 18s','Example only']])+'<div style="height:22px"></div>'+tabs(['Summary','Test results','Live logs','Artifacts'])+panel('Execution timeline','<div class="flow"><div class="node">Queued ✓</div>→<div class="node">Provisioned ✓</div>→<div class="node">Running ✓</div>→<div class="node">Failed</div></div>')+'<div style="height:18px"></div>'+panel('Logs','<div class="code">[00:01] Starting isolated test job (illustrative)\n<br>[00:09] 128 tests passed\n<br>[02:18] AssertionError: expected 200, received 500\n<br>[02:18] Execution completed with failures</div>');break;case'AI Analysis':sub='Investigate failures with evidence, not guesses.';action='<button class="secondary">New investigation</button>';s='<div class="panel chat"><aside><b>Investigations</b><p class="label">RUN-1042 · Session failure</p><p class="label">RUN-1037 · Timeout</p><p class="label">RUN-1033 · Flaky test</p></aside><div><div class="bubble userbubble">Why did the authentication tests fail?</div><div class="bubble"><b>ATIP analysis · example</b><p>The session middleware appears to return an unexpected status. This is a <b>hypothesis</b>, not a confirmed root cause.</p><p class="label">Evidence: RUN-1042 logs · src/auth/session.py</p><button class="secondary" onclick="alert(\'Demo: investigation requires configured model provider.\')">Inspect evidence ↗</button></div><div style="padding:18px"><input style="width:100%" placeholder="Ask about a failure… (demo only)" onkeydown="if(event.key===\'Enter\')alert(\'Demo only; connect an AI provider.\')"></div></div></div>';break;case'Reports':sub='Quality trends and traceable engineering evidence.';action='<button class="secondary" onclick="alert(\'Export will use real backend reports.\')">↓ Export report</button>';s=stats([['Test success','96.8%','Example data'],['Mean duration','1m 52s','Example data'],['Risk trend','−12%','Example data'],['Investigations','14','Example data']])+'<div class="section">'+panel('Test reliability','<div class="panelbody"><div class="bars">'+[51,57,64,61,69,73,78,82,79,90].map(h=>'<i style="height:'+h+'%"></i>').join('')+'</div></div>')+panel('Recent reports',rows([['Report','Date'],['Weekly quality','Oct 18'],['Risk summary','Oct 17'],['Run history','Oct 16']]))+'</div>';break;case'Settings':sub='Manage your workspace and integration policies.';s=tabs(['Profile','Organization','Members','GitHub','AI Providers','Execution','Notifications','Audit','Appearance'])+panel('Workspace preferences','<div class="panelbody"><p>Workspace name</p><input value="Acme Workspace"><p>Appearance</p><button class="secondary" onclick="document.body.classList.toggle(\'dark\')">Toggle light / dark</button><p class="label">GitHub, provider keys and execution policies require real backend integrations.</p></div>');break;case'Sign In':sub='Secure access to ATIP.';s=panel('Welcome to ATIP','<div class="empty"><strong>Continue to your workspace</strong><p>OIDC provider connection is not configured in this reference.</p><button class="primary" onclick="alert(\'Configure OIDC in M2.\')">Continue with SSO</button></div>');break}if(n==='Repository Workspace')s+=panel('Coverage Objectives · white-box','<div class=panelbody>Statement · branch · condition · MC/DC · basis path · loop · def-use · exceptions. <button class=secondary onclick="view(\'White-Box Coverage\')">Open coverage matrix ↗</button></div>');if(n==='Test Plans')s+=panel('Coverage-driven plan objectives','<div class=panelbody>MC/DC independence pairs, feasible path targets, loops, data-flow pairs, exception edges, boundaries and regression tests. All candidate tests require execution evidence.</div>');if(n==='Run Details')s+=panel('Instrumentation & mutation evidence','<div class=panelbody>Condition vectors, executed MC/DC pairs, CFG path traces, def-use observations, mutants killed/survived and missing instrumentation. Demo only.</div>');if(n==='Reports')s+=panel('White-box quality history','<div class=panelbody>Per-technique covered / uncovered / unknown / unsupported objectives, MC/DC evidence and mutation score, filtered by repository and commit. Demo only.</div>');document.getElementById('subtitle').textContent=sub;document.getElementById('action').innerHTML=action;document.getElementById('page').innerHTML=s;window.scrollTo(0,0)}document.getElementById('nav').innerHTML=names.filter(x=>x!=='Settings').map(n=>'<button data-page="'+n+'" onclick="view(\''+n+'\')"><span class="glyph">'+icons[names.indexOf(n)]+'</span><span class="navlabel">'+n+'</span></button>').join('');view(decodeURIComponent(location.hash.slice(1)) && names.includes(decodeURIComponent(location.hash.slice(1))) ? decodeURIComponent(location.hash.slice(1)) : 'Overview');</script></body></html>
