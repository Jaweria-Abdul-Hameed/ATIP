services:
  postgres:
    image: postgres:16-alpine
    container_name: atip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atip_db}
      POSTGRES_USER: ${POSTGRES_USER:-atip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atip_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - atip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atip} -d ${POSTGRES_DB:-atip_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - atip_network

  redis:
    image: redis:7-alpine
    container_name: atip_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - atip_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - atip_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: atip_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-atip}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-atip_dev_password}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - atip_rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - atip_network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: atip_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atipadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atipsecretpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - atip_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - atip_network

volumes:
  atip_pgdata:
    name: atip_pgdata
  atip_redisdata:
    name: atip_redisdata
  atip_rabbitdata:
    name: atip_rabbitdata
  atip_miniodata:
    name: atip_miniodata

networks:
  atip_network:
    name: atip_network
    driver: bridge
