[project]
name = "atip-api"
version = "0.1.0"
description = "ATIP — Autonomous Testing Intelligence Platform Backend Modular Monolith"
readme = "README.md"
authors = [
    { name = "Jaweria Abdul Hameed", email = "jaweria.abdulhameed@atip.local" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.2.0",
    "fastapi>=0.156.8",
    "greenlet>=3.1.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
atip-api = "atip_api.main:run"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "UP042", "UP046"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
